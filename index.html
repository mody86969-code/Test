<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f1e8">
<title>For Jana ♡</title>
<style>
  :root { --paper:#fbf5ec; --ink:#453b38; --rose:#b66f73; --muted:#8c7b73; --line:#e8d8ca; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
    color:var(--ink); background:
      radial-gradient(ellipse at 12% 12%, rgba(220,174,163,.20), transparent 34%),
      radial-gradient(ellipse at 88% 88%, rgba(194,160,133,.17), transparent 35%), var(--paper);
    font-family: Georgia, "Times New Roman", serif;
  }
  .card {
    width:min(100%, 430px); position:relative; text-align:center; padding:43px 27px 32px;
    border:1px solid var(--line); background:rgba(255,252,247,.78);
    box-shadow:0 18px 55px rgba(94,66,52,.09);
    animation: arrive 1.1s ease both;
  }
  .card:before { content:""; position:absolute; inset:8px; border:1px solid rgba(182,111,115,.18); pointer-events:none; }
  .eyebrow { font:10px/1.6 Arial,sans-serif; letter-spacing:.28em; text-transform:uppercase; color:var(--rose); }
  .heart { font-size:27px; color:var(--rose); margin:19px 0 11px; animation: heartbeat 2.8s ease-in-out infinite; }
  h1 { font-weight:normal; font-size:clamp(35px, 10vw, 46px); line-height:1.08; margin:0 0 14px; letter-spacing:-.035em; }
  .message { max-width:290px; margin:0 auto; font-size:16px; line-height:1.8; color:#76655e; }
  .divider { display:flex; align-items:center; gap:13px; margin:27px auto 24px; width:78%; color:#c99b91; font-size:12px; }
  .divider:before,.divider:after { content:""; height:1px; background:var(--line); flex:1; }
  .song-label { font:10px Arial,sans-serif; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .song-title { font-size:25px; margin:0; font-weight:normal; }
  .artist { color:var(--muted); font:12px Arial,sans-serif; letter-spacing:.08em; margin-top:7px; }
  .play {
    appearance:none; border:0; margin-top:23px; padding:14px 22px; min-width:190px; border-radius:99px;
    background:var(--rose); color:white; font:12px Arial,sans-serif; letter-spacing:.12em;
    cursor:pointer; transition:transform .2s, background .2s; box-shadow:0 7px 18px rgba(182,111,115,.22);
  }
  .play:hover { transform:translateY(-2px); background:#a65f65; }
  .play:focus-visible { outline:2px solid var(--ink); outline-offset:4px; }
  .note { min-height:35px; margin:14px auto 0; font:12px/1.6 Arial,sans-serif; color:var(--muted); }
  .closing { margin-top:22px; font-size:15px; font-style:italic; color:#8e6e68; }
  .signature { margin-top:9px; font-size:12px; letter-spacing:.04em; color:var(--muted); }
  .petal { position:fixed; top:-20px; color:#c88787; opacity:.45; pointer-events:none; animation: fall linear forwards; }
  @keyframes arrive { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:translateY(0)} }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 8%{transform:scale(1.12)} 16%{transform:scale(1)} }
  @keyframes fall { to { transform:translate3d(var(--drift),110vh,0) rotate(300deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { *,*:before,*:after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">A little something, just for you</div>
  <div class="heart" aria-hidden="true">♡</div>
  <h1>For Jana</h1>
  <p class="message">Some feelings are hard to put into words…<br>so I found a song that says a little of what’s in my heart.</p>
  <div class="divider" aria-hidden="true">✧</div>
  <div class="song-label">Your song</div>
  <h2 class="song-title">عشانك</h2>
  <div class="artist">SILAWY · سيلاوي</div>
  <button class="play" id="playButton" type="button">♡ &nbsp; PLAY YOUR SONG</button>
  <p class="note" id="note" aria-live="polite">A tiny song, with a lot of feeling.</p>
  <div class="closing">This one's for you. ♡</div>
  <div class="signature">With love, always</div>
</main>
<script>
  // Replace the URL below with the official song link you want to use.
  const SONG_URL = "https://www.youtube.com/results?search_query=%D8%B3%D9%8A%D9%84%D8%A7%D9%88%D9%8A+%D8%B9%D8%B4%D8%A7%D9%86%D9%83";
  const button = document.getElementById("playButton");
  const note = document.getElementById("note");
  button.addEventListener("click", () => {
    note.textContent = "Opening your song… ♡";
    window.open(SONG_URL, "_blank", "noopener,noreferrer");
  });
  // A few very subtle floating hearts, kept intentionally sparse.
  function heart() {
    const el = document.createElement("span");
    el.className = "petal";
    el.textContent = Math.random() > .45 ? "♡" : "·";
    el.style.left = (Math.random() * 100) + "vw";
    el.style.fontSize = (12 + Math.random() * 10) + "px";
    el.style.setProperty("--drift", ((Math.random() * 90) - 45) + "px");
    el.style.animationDuration = (9 + Math.random() * 7) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 17000);
  }
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setInterval(heart, 2400);
  }
</script>
</body>
</html>
